version: "3.8"

# 研王爷微服务 · 基础设施编排
# 启动：docker compose -f docker-compose.yml up -d
# 说明：
#   - 各业务微服务（ywy-gateway/auth/user/study/rag/community/shopping）默认以独立 JVM 进程运行，
#     见 scripts/start-services.ps1；本文件只提供它们依赖的中间件。
#   - 一期向量检索用内存实现（ywy.rag.vector.store=memory），无需 Milvus；
#     生产接入 Milvus 时可启用下方 milvus 段。
#   - 对象存储一期用本地目录（ywy.rag.storage.type=local），无需 RustFS；
#     生产按 README 切换 RustFS。

services:
  mysql:
    image: mysql:8.0.36
    container_name: ywy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ywy
      TZ: Asia/Shanghai
    ports:
              - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./deploy/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql

  redis:
            image: redis:7.2.4
            container_name: ywy-redis
            restart: unless-stopped
            ports:
              - "16379:6379"
            command: [ "redis-server", "--appendonly", "yes" ]

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ywy-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs

  # 生产接入向量检索时启用（需额外依赖 etcd + minio，这里给出接入骨架）
  # milvus-standalone:
  #   image: milvusdb/milvus:v2.4.4
  #   container_name: ywy-milvus
  #   command: ["milvus", "run", "standalone"]
  #   security_opt:
  #     - seccomp:unconfined
  #   environment:
  #     ETCD_ENDPOINTS: etcd:2379
  #     MINIO_ADDRESS: minio:9000
  #   ports:
  #     - "19530:19530"
  #   depends_on:
  #     - etcd

volumes:
  mysql-data:
  nacos-data:
  nacos-logs: