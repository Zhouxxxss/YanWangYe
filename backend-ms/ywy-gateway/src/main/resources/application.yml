server:
  port: 8100

spring:
  application:
    name: ywy-gateway
  config:
    import: optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:yanyan}
        ip: ${NACOS_IP:127.0.0.1}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:yanyan}
        file-extension: yml
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # 认证授权（登录/注册/刷新需鉴权白名单）
        - id: ywy-auth
          uri: lb://ywy-auth
          predicates:
            - Path=/auth/**,/v3/api-docs/auth/**
        # 用户模块：档案 + 好友
        - id: ywy-user
          uri: lb://ywy-user
          predicates:
            - Path=/users/**,/friends/**
        # 学习模块：错题/背诵/计时/计划/数据大盘/遗忘曲线
        - id: ywy-study
          uri: lb://ywy-study
          predicates:
            - Path=/wrongbook/**,/recite/**,/study/**,/plan/**,/dashboard/**,/anki/**
        # RAG 知识库：答疑 + 文件分片上传
        - id: ywy-rag
          uri: lb://ywy-rag
          predicates:
            - Path=/rag/**,/knowledge/**
        # 二期预留：社区（发帖/好友聊天）、购物（二手资料/商家入驻）
        - id: ywy-community
          uri: lb://ywy-community
          predicates:
            - Path=/community/**
        - id: ywy-shopping
          uri: lb://ywy-shopping
          predicates:
            - Path=/shopping/**
        # 默认路由：其余命中直接转发到注册中心由服务名解析
        - id: ywy-default
          uri: lb://ywy-user
          predicates:
            - Path=/**

ywy:
  jwt:
    secret: ${JWT_SECRET:ywy-dev-secret-change-me-in-prod-0123456789012345}
    expire-ms: 7200000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: auth
        url: /v3/api-docs/auth
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway